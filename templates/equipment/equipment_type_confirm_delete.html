{% extends 'core/base.html' %}
{% load static %}
{% block title %}Apaga Tipu Ekipamentu{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4" style="max-width:480px;">
  <div class="card shadow-sm border-0 p-4 text-center">
    <i class="bi bi-exclamation-triangle-fill text-danger mb-3" style="font-size:2.5rem;"></i>
    <h5 class="fw-bold mb-2" style="color:#1e293b;">Konfirma Apaga</h5>
    <p class="text-muted mb-4">
      Ita hakarak apaga tipu ekipamentu <strong>"{{ object.name }}"</strong>?<br>
      <small>La bele apaga se iha ekipamentu ho tipu ne'e.</small>
    </p>
    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4">
        <i class="bi bi-trash me-1"></i> Apaga
      </button>
      <a href="{% url 'equipment:equipment_type_list' %}" class="btn btn-outline-secondary px-4">
        Kansela
      </a>
    </form>
  </div>
</div>
{% endblock %}
